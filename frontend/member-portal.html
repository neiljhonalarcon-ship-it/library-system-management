<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portal - Library Management System</title>
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/books.css">
    <link rel="stylesheet" href="/css/member-portal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- MEMBER SIDEBAR -->
    <aside class="sidebar member-sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon member-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            </div>
            <div>
                <h2>My Portal</h2>
                <span id="sidebar-name">Member</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" onclick="switchTab('dashboard', this); return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('browse', this); return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>Browse Books</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('reservations', this); return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><polyline points="8 15 11 18 16 13"></polyline></svg>
                <span>My Reservations</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('history', this); return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span>My History</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('fines', this); return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><line x1="12" y1="6" x2="12" y2="18"></line></svg>
                <span>My Fines</span>
            </a>
        </nav>

        <button class="logout-btn" onclick="memberLogout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Logout
        </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="page-header">
            <div>
                <h1 id="page-title">My Dashboard</h1>
                <p id="page-subtitle">Welcome back!</p>
            </div>
            <div class="header-date">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span id="current-date"></span>
            </div>
        </header>

        <div id="content-area">
            <!-- Content loaded by JS -->
        </div>

    </main>

    <!-- RESERVATION MODAL -->
    <div class="modal-overlay" id="reserveModal">
        <div class="modal reserve-modal">
            <div class="modal-header">
                <div class="reserve-header-content">
                    <div class="reserve-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <h2>Reserve a Book</h2>
                </div>
                <button class="modal-close" onclick="closeReserveModal()">✕</button>
            </div>

            <div class="modal-body">
                <div class="reserve-book-info">
                    <div class="reserve-book-title" id="reserveBookTitle">Book Title</div>
                    <div class="reserve-book-author" id="reserveBookAuthor">Author</div>
                </div>

                <p class="reserve-subtitle">
                    Let us know when you'll come pick it up.
                </p>

                <div class="form-group">
                    <label for="reserveDate">📅 Pickup Date *</label>
                    <input type="date" id="reserveDate" required>
                </div>

                <div class="form-group">
                    <label for="reserveTime">🕐 Pickup Time *</label>
                    <input type="time" id="reserveTime" required>
                </div>

                <div class="form-group">
                    <label for="reserveNotes">📝 Notes (optional)</label>
                    <textarea id="reserveNotes" placeholder="e.g., I'll come after class" maxlength="200"></textarea>
                </div>

                <button type="button" class="btn-primary reserve-submit" onclick="submitReservation()" id="reserveSubmitBtn">
                    <span class="btn-text">Confirm Reservation</span>
                </button>

                <div id="reserveError" class="error-msg"></div>
            </div>
        </div>
    </div>

    <script src="/js/toast.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/member-portal.js"></script>
</body>
</html>
