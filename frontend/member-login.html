<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - Library Management System</title>
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-container">
        <div class="login-box">

            <a href="/" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Home
            </a>

            <div class="logo-section">
                <div class="logo-icon member-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                </div>
                <h1>Member Login</h1>
                <p class="subtitle">Sign in to access your library account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper password-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" title="Show password">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div style="text-align: right; margin-top: 8px;">
                        <a href="#" onclick="openForgotModal(); return false;" style="font-size: 13px; color: #0ea5e9; text-decoration: none; font-weight: 500;">Forgot Password?</a>
                    </div>
                </div>

                <button type="submit" class="btn-login member-btn">
                    <span class="btn-text">Sign In</span>
                    <svg class="btn-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

                <div id="errorMsg" class="error-msg"></div>
            </form>

            <div class="link-text">
                Don't have an account yet?
                <a href="/member-register">Register Now</a>
            </div>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div class="modal-overlay" id="forgotModal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
        <div class="modal" style="background: white; border-radius: 16px; max-width: 440px; width: 100%; padding: 32px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
            <button onclick="closeForgotModal()" style="position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 22px; cursor: pointer; color: #94a3b8; width: 32px; height: 32px; border-radius: 8px;">✕</button>

            <!-- STEP 1: Enter email -->
            <div id="forgotStep1">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="display: inline-block; width: 60px; height: 60px; background: linear-gradient(135deg, #14b8a6, #0ea5e9); border-radius: 16px; line-height: 60px; font-size: 28px;">🔑</div>
                </div>
                <h2 style="text-align: center; color: #0f172a; font-size: 22px; margin: 0 0 8px 0;">Forgot Password?</h2>
                <p style="text-align: center; color: #64748b; font-size: 14px; margin: 0 0 24px 0;">Enter your email and we'll send you a reset code.</p>

                <div class="form-group">
                    <label for="forgotEmail" style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="juan@email.com" required style="width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: inherit; box-sizing: border-box;">
                </div>

                <button type="button" onclick="sendResetCode()" id="sendCodeBtn" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #14b8a6, #0ea5e9); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 16px;">
                    Send Reset Code
                </button>
                <div id="forgotError1" style="color: #dc2626; font-size: 13px; text-align: center; margin-top: 12px;"></div>
            </div>

            <!-- STEP 2: Enter code + new password -->
            <div id="forgotStep2" style="display: none;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="display: inline-block; width: 60px; height: 60px; background: linear-gradient(135deg, #14b8a6, #0ea5e9); border-radius: 16px; line-height: 60px; font-size: 28px;">✉️</div>
                </div>
                <h2 style="text-align: center; color: #0f172a; font-size: 22px; margin: 0 0 8px 0;">Enter Reset Code</h2>
                <p style="text-align: center; color: #64748b; font-size: 14px; margin: 0 0 24px 0;">We sent a 6-digit code to <strong id="forgotEmailDisplay"></strong></p>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">6-Digit Code</label>
                    <input type="text" id="resetCode" placeholder="123456" maxlength="6" inputmode="numeric" style="width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 20px; font-weight: 700; letter-spacing: 4px; text-align: center; font-family: inherit; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="newPassword" style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">New Password</label>
                    <input type="password" id="newPassword" placeholder="At least 6 characters" minlength="6" style="width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: inherit; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin-bottom: 8px;">
                    <label for="confirmNewPassword" style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" minlength="6" style="width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: inherit; box-sizing: border-box;">
                </div>

                <button type="button" onclick="resetPassword()" id="resetBtn" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #14b8a6, #0ea5e9); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 16px;">
                    Reset Password
                </button>
                <button type="button" onclick="backToStep1()" style="width: 100%; padding: 10px; background: none; color: #64748b; border: none; font-size: 13px; cursor: pointer; margin-top: 8px;">← Use a different email</button>
                <div id="forgotError2" style="color: #dc2626; font-size: 13px; text-align: center; margin-top: 12px;"></div>
            </div>
        </div>
    </div>

    <script src="/js/toast.js"></script>
    <script src="/js/member-login.js"></script>
</body>
</html>
