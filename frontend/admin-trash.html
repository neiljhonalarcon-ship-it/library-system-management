<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash - Library Management System</title>
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/books.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <div>
                <h2>Library</h2>
                <span>Management</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                <span>Dashboard</span>
            </a>
            <a href="/books" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>Books</span>
            </a>
            <a href="/members" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Members</span>
            </a>
            <a href="/borrow" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                <span>Borrow / Return</span>
            </a>
            <a href="/admin/reservations" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><polyline points="8 15 11 18 16 13"></polyline></svg>
                <span>Reservations</span>
                <span class="badge" id="pendingReservationsBadge" style="display:none;">0</span>
            </a>
            <a href="/fines" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><line x1="12" y1="6" x2="12" y2="18"></line></svg>
                <span>Fines</span>
            </a>
            <a href="/reports" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span>Reports</span>
            </a>
            <a href="/admin/approvals" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>
                <span>Approvals</span>
                <span class="badge" id="pendingCount" style="display:none;">0</span>
            </a>
            <a href="/admin/trash" class="nav-item active">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                <span>Trash</span>
                <span class="badge" id="trashCountBadge" style="display:none;">0</span>
            </a>
        </nav>

        <button class="logout-btn" onclick="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Logout
        </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="page-header">
            <div>
                <h1>Trash</h1>
                <p>Restore or permanently delete items</p>
            </div>
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <!-- THEME TOGGLE BUTTON -->
                <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark/Light Mode">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <!-- BELL ICON -->
                <div class="admin-bell-container" id="adminBellContainer">
                    <button class="admin-bell-btn" id="admin-bell-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="admin-bell-badge" class="admin-bell-badge" style="display:none;">0</span>
                    </button>
                    <div id="admin-notif-dropdown" class="admin-notif-dropdown">
                        <div style="padding: 15px; text-align: center; color: #64748b; font-size: 13px;">Loading...</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- TOOLBAR -->
        <div class="books-toolbar" style="margin-bottom: 20px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" style="width: 18px; height: 18px; cursor:pointer;">
                <label for="selectAll" style="font-weight: 700; cursor:pointer; color: var(--text-main);">Select All</label>
            </div>
            <div style="display:flex; gap:10px;">
                <!-- MGA BUTTONS -->
                <button id="restoreBtn" class="btn-primary" onclick="openRestoreModal()" disabled style="padding: 8px 16px; font-size: 13px; background:#10b981; border: none; border-radius: 8px; cursor: not-allowed; color: white; font-weight: 600; opacity: 0.5;">Restore Selected</button>
                <button id="deleteBtn" class="btn-secondary" onclick="deleteSelectedPermanently()" disabled style="padding: 8px 16px; font-size: 13px; background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; border-radius: 8px; cursor: not-allowed; font-weight: 600; opacity: 0.5;">Delete Permanently</button>
            </div>
        </div>

        <!-- TRASH LIST -->
        <div id="trashList" class="books-container list-view">
            <div class="loading-state">Loading trash...</div>
        </div>

    </main>

    <!-- 🚨 CUSTOM PASSWORD MODAL (NEW PREMIUM DESIGN) -->
    <div class="modal-overlay" id="passwordModal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; animation: fadeInModal 0.2s ease-out;">
        <div class="custom-modal-box" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; max-width: 420px; width: 90%; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); position: relative; text-align: center; animation: popInModal 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
            
            <!-- Close Button sa Taas -->
            <button onclick="closePasswordModal()" style="position: absolute; top: 16px; right: 16px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; transition: 0.2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <!-- Icon na may Glow -->
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>

            <h2 style="color: var(--text-main); font-size: 22px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px;">Admin Authorization</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin: 0 0 24px 0; line-height: 1.5;">Enter your admin password to restore the selected items.</p>
            
            <!-- Input Field -->
            <input type="password" id="adminPasswordInput" placeholder="Enter admin password" autocomplete="off" style="width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); background: var(--bg-main); color: var(--text-main); border-radius: 12px; font-size: 15px; font-family: inherit; margin-bottom: 24px; box-sizing: border-box; outline: none; transition: all 0.3s ease;">
            
            <!-- Buttons -->
            <div style="display: flex; gap: 12px;">
                <button onclick="closePasswordModal()" style="flex: 1; padding: 14px; background: var(--bg-hover); border: 1px solid var(--border-color); border-radius: 12px; font-weight: 700; color: var(--text-main); cursor: pointer; transition: all 0.2s ease;">Cancel</button>
                <button onclick="confirmRestore()" id="confirmRestoreBtn" style="flex: 1; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; font-weight: 700; color: white; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.2s ease;">Confirm</button>
            </div>
        </div>
    </div>

    <script src="/js/toast.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/admin-trash.js"></script>
    <script src="/js/theme.js"></script>
</body>
</html>
